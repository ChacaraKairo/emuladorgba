name: Native CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            with_mgba: ON
          - os: windows-latest
            with_mgba: OFF

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build
          -DEMULADORGBA_BUILD_TESTS=ON
          -DEMULADORGBA_BUILD_CLI=ON
          -DEMULADORGBA_WITH_MGBA=${{ matrix.with_mgba }}

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
