name: Flutter CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee flutter-analyze.log

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee flutter-test.log

      - name: Upload Flutter logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ci-logs
          path: |
            apps/frontend_flutter/flutter-analyze.log
            apps/frontend_flutter/flutter-test.log
          if-no-files-found: ignore
